<svg width="900" height="640" viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="640" fill="#0b0f1a"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8c97b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="450" y="40" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="22" font-weight="700" fill="#eaf0fa">SpendSense-XAI &#8212; System Architecture</text>
  <text x="450" y="62" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#8c97b8">Detect &#8594; Explain &#8594; Intervene &#8594; Measure &#8594; Learn &#8594; Adapt (closed loop)</text>

  <!-- Client -->
  <rect x="240" y="90" width="420" height="64" rx="10" fill="#1a2440" stroke="#5b6584" stroke-width="1"/>
  <text x="450" y="114" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="15" font-weight="600" fill="#eaf0fa">Client &#8212; React + Vite SPA</text>
  <text x="450" y="134" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#8c97b8">Dashboard, Expenses, Insights, Interventions, Goals, Report</text>
  <line x1="450" y1="154" x2="450" y2="190" stroke="#5b6584" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- API Gateway -->
  <rect x="240" y="190" width="420" height="64" rx="10" fill="#122a4a" stroke="#4d8bff" stroke-width="1"/>
  <text x="450" y="214" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="15" font-weight="600" fill="#eaf0fa">API Gateway &#8212; FastAPI</text>
  <text x="450" y="234" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#9fb6e0">JWT auth &#183; bcrypt &#183; CORS allowlist &#183; rate limiting</text>
  <line x1="450" y1="254" x2="450" y2="290" stroke="#5b6584" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Intelligence engine container -->
  <rect x="90" y="290" width="720" height="190" rx="16" fill="none" stroke="#5b6584" stroke-width="1" stroke-dasharray="5 5"/>
  <text x="112" y="316" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600" fill="#eaf0fa">Context-Aware Intelligence Engine</text>

  <rect x="112" y="332" width="200" height="128" rx="10" fill="#241a3f" stroke="#9b8cff" stroke-width="1"/>
  <text x="212" y="358" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600" fill="#eaf0fa">Trigger Engine</text>
  <text x="212" y="380" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#c9c1f5">Context fingerprinting</text>
  <text x="212" y="398" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#c9c1f5">Weighted decay mining</text>
  <text x="212" y="416" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#c9c1f5">Confidence + expiration</text>

  <rect x="350" y="332" width="200" height="128" rx="10" fill="#0f2b28" stroke="#35d0c0" stroke-width="1"/>
  <text x="450" y="358" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600" fill="#eaf0fa">XAI Layer</text>
  <text x="450" y="380" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#a6ede4">Evidence-grounded</text>
  <text x="450" y="398" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#a6ede4">natural-language</text>
  <text x="450" y="416" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#a6ede4">explanations</text>

  <rect x="588" y="332" width="200" height="128" rx="10" fill="#3a1f18" stroke="#ff6b6b" stroke-width="1"/>
  <text x="688" y="358" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600" fill="#eaf0fa">Intervention A/B</text>
  <text x="688" y="380" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#ffb3b3">Habit/Delay/Limit/</text>
  <text x="688" y="398" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#ffb3b3">Friction nudges</text>
  <text x="688" y="416" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#ffb3b3">Effectiveness measurement</text>

  <line x1="450" y1="480" x2="450" y2="516" stroke="#5b6584" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Data layer -->
  <rect x="240" y="516" width="420" height="64" rx="10" fill="#132a1c" stroke="#6fdc8c" stroke-width="1"/>
  <text x="450" y="540" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="15" font-weight="600" fill="#eaf0fa">Data Layer &#8212; SQLite (dev) / PostgreSQL (prod)</text>
  <text x="450" y="560" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#a9e8bc">users &#183; expenses &#183; triggers &#183; interventions &#183; goals</text>

  <!-- feedback loop -->
  <path d="M760 548 C 850 548, 850 122, 662 122" fill="none" stroke="#f5a623" stroke-width="1.2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <text x="855" y="335" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#f5a623" transform="rotate(90 855 335)">closed feedback loop &#8212; measure &#8594; learn &#8594; adapt</text>
</svg>
